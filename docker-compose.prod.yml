# Production-oriented compose: builds the api + web images, runs migrations as a
# one-shot before the api starts, and serves both behind their own ports.
# Secrets come from a .env file next to this compose (never committed) — see
# .env.example for the required keys.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-archai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-archai}
    volumes:
      - archai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-archai} -d ${POSTGRES_DB:-archai}']
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: applies Prisma migrations using the build stage (which has the CLI),
  # then exits. The api waits for it to complete successfully.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    command: pnpm --filter @archai/api exec prisma migrate deploy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: '3001'
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL_SEC: ${JWT_ACCESS_TTL_SEC:-900}
      JWT_REFRESH_TTL_SEC: ${JWT_REFRESH_TTL_SEC:-2592000}
      COOKIE_SECURE: 'true'
      # Number of trusted reverse-proxy hops in front of the API. Without this the
      # per-IP rate limiter keys on the proxy address and collapses every user into
      # a single bucket — set it to the real hop count for your deployment.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # ── Runtime AI (server-side only; see docs/ai-architecture.md) ──────────
      # Empty keys are supported: the API boots and the AI endpoints answer a
      # documented 503 AI_NOT_CONFIGURED instead of failing to start.
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-groq}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_PRIMARY_MODEL: ${AI_PRIMARY_MODEL:-}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-}
      AI_MAX_REQUESTS_PER_USER_PER_DAY: ${AI_MAX_REQUESTS_PER_USER_PER_DAY:-20}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-1}
    ports:
      - '3001:3001'
    healthcheck:
      # slim image has no curl/wget — probe /ready with node (503 when DB is down,
      # so the container is only "healthy" when it can actually serve traffic).
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3001/api/v1/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  archai_pgdata:
